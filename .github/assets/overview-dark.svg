<svg xmlns="http://www.w3.org/2000/svg" width="880" height="302" viewBox="0 0 880 302" role="img" aria-label="poke.me.at at a glance: A room is a link, Face down until the reveal, The numbers that matter, Gone after a quiet day">
<rect x="0.5" y="0.5" width="879" height="301" rx="12" fill="#0a0a0a" stroke="#262626"/>
<rect x="24" y="24" width="196" height="254" rx="10" fill="#171717" stroke="#262626"/>
<text x="44" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">01</text>
<line x1="72" y1="56" x2="200" y2="56" stroke="#404040" stroke-width="1"/>
<text x="44" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="44" dy="0">A room is</tspan><tspan x="44" dy="22">a link</tspan></text>
<text x="44" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="44" dy="0">Open a room and</tspan><tspan x="44" dy="21">paste the link into</tspan><tspan x="44" dy="21">the call. People join</tspan><tspan x="44" dy="21">with a name; nobody</tspan><tspan x="44" dy="21">needs an account.</tspan></text>
<rect x="236" y="24" width="196" height="254" rx="10" fill="#171717" stroke="#262626"/>
<text x="256" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">02</text>
<line x1="284" y1="56" x2="412" y2="56" stroke="#404040" stroke-width="1"/>
<text x="256" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="256" dy="0">Face down until</tspan><tspan x="256" dy="22">the reveal</tspan></text>
<text x="256" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="256" dy="0">Nobody sees a card</tspan><tspan x="256" dy="21">until the host</tspan><tspan x="256" dy="21">reveals, or the last</tspan><tspan x="256" dy="21">vote lands with</tspan><tspan x="256" dy="21">auto-reveal on.</tspan></text>
<rect x="448" y="24" width="196" height="254" rx="10" fill="#171717" stroke="#262626"/>
<text x="468" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">03</text>
<line x1="496" y1="56" x2="624" y2="56" stroke="#404040" stroke-width="1"/>
<text x="468" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="468" dy="0">The numbers</tspan><tspan x="468" dy="22">that matter</tspan></text>
<text x="468" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="468" dy="0">The spread, average,</tspan><tspan x="468" dy="21">median and range,</tspan><tspan x="468" dy="21">plus the deck card</tspan><tspan x="468" dy="21">nearest the average.</tspan></text>
<rect x="660" y="24" width="196" height="254" rx="10" fill="#171717" stroke="#262626"/>
<text x="680" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#525252">04</text>
<line x1="708" y1="56" x2="836" y2="56" stroke="#404040" stroke-width="1"/>
<text x="680" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600"><tspan x="680" dy="0">Gone after</tspan><tspan x="680" dy="22">a quiet day</tspan></text>
<text x="680" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="680" dy="0">A room expires a day</tspan><tspan x="680" dy="21">after its last write.</tspan><tspan x="680" dy="21">The server keeps</tspan><tspan x="680" dy="21">only a hash of each</tspan><tspan x="680" dy="21">participant secret.</tspan></text>
</svg>
